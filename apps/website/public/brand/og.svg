<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Muse Memory — Give your agents a memory that verifies itself">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090f"/>
      <stop offset="1" stop-color="#0e1424"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cf7"/>
      <stop offset="1" stop-color="#4fd6e0"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.15" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#8b7cf7" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#8b7cf7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.9" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#4fd6e0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4fd6e0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ink)"/>
  <rect width="1200" height="630" fill="url(#glowV)"/>
  <rect width="1200" height="630" fill="url(#glowC)"/>

  <!-- big headline -->
  <text x="80" y="150" font-family="Inter, 'Segoe UI', sans-serif" font-size="30" font-weight="600" fill="#4fd6e0" letter-spacing="6">MUSE MEMORY</text>
  <text x="76" y="260" font-family="Inter, 'Segoe UI', sans-serif" font-size="74" font-weight="800" fill="#e8ecf8" letter-spacing="-2">Give your agents a memory</text>
  <text x="76" y="350" font-family="Inter, 'Segoe UI', sans-serif" font-size="74" font-weight="800" letter-spacing="-2" fill="url(#accent)">that verifies itself.</text>

  <text x="80" y="420" font-family="Inter, 'Segoe UI', sans-serif" font-size="26" fill="#9aa5c3">Sub-millisecond local recall · write-time citation verification ·</text>
  <text x="80" y="458" font-family="Inter, 'Segoe UI', sans-serif" font-size="26" fill="#9aa5c3">deterministic lifecycle — one command, 80+ agent platforms.</text>

  <!-- install chip -->
  <g>
    <rect x="80" y="500" rx="14" width="420" height="62" fill="#0c1019" stroke="#2a3557"/>
    <text x="104" y="539" font-family="Menlo, Consolas, monospace" font-size="23" fill="#e8ecf8">$ npx <tspan fill="#4fd6e0">musememory</tspan> connect</text>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="19" fill="#64708f">
    <text x="530" y="539">github.com/harshsinghmp/musememory</text>
  </g>

  <!-- synapse corner motif -->
  <g stroke="url(#accent)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M920 120 L990 40 L1060 120 L1130 40"/>
  </g>
  <circle cx="920" cy="120" r="8" fill="#8b7cf7"/>
  <circle cx="990" cy="40" r="8" fill="#4fd6e0"/>
  <circle cx="1060" cy="120" r="8" fill="#8b7cf7"/>
  <circle cx="1130" cy="40" r="8" fill="#4fd6e0"/>

  <rect x="0" y="624" width="1200" height="6" fill="url(#accent)"/>
</svg>
