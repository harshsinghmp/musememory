name: GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      rebuild-showreel:
        description: "Re-render the showreel from the HyperFrames composition in CI"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── Showreel freshness gate (hash-verified) ──────────────────────────
      # The committed showreel.mp4 is rendered from the HyperFrames
      # composition (apps/website/showreel-hf/) — the render is done locally
      # via `bun run site:showreel`, never during deploy. The hash of the
      # composition + build script + fonts is stored beside the video; a
      # mismatch fails the deploy fast so the video can never drift from
      # its source. To refresh: run `bun run site:showreel`, commit the new
      # video + hash, or dispatch this workflow with rebuild-showreel=true.
      - name: Compute showreel input hash
        id: reelhash
        run: |
          INPUTS=$( (cat \
            apps/website/showreel-hf/index.html \
            apps/website/scripts/build-showreel.ts \
            ; sha256sum apps/website/showreel-hf/assets/fonts/*.woff2) \
            | sha256sum | cut -d' ' -f1)
          STORED=$(cat apps/website/public/brand/.showreel-hash 2>/dev/null || echo "none")
          echo "hash=$INPUTS" >> "$GITHUB_OUTPUT"
          echo "stored=$STORED" >> "$GITHUB_OUTPUT"
          if [ "$INPUTS" != "$STORED" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail on stale showreel (source changed, video not rebuilt)
        if: steps.reelhash.outputs.stale == 'true' && inputs.rebuild-showreel != true
        run: |
          echo "::error::showreel.mp4 is stale — the HyperFrames composition changed without a re-render."
          echo "Refresh locally with: bun run site:showreel"
          echo "Then commit the new public/showreel.mp4, showreel-poster.png, and public/brand/.showreel-hash."
          exit 1

      - name: Rebuild showreel in CI (dispatched)
        if: inputs.rebuild-showreel == true
        run: |
          cd apps/website
          bun scripts/build-showreel.ts
          echo "${{ steps.reelhash.outputs.hash }}" > public/brand/.showreel-hash
          echo "⚠ Commit the regenerated showreel + updated public/brand/.showreel-hash." >> "$GITHUB_STEP_SUMMARY"

      - name: Build website
        run: bun run site:build

      - name: Refresh committed brand assets (banner/OG changed)
        run: |
          cd apps/website
          bun scripts/render-brand-assets.ts

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
