name: GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      rebuild-showreel:
        description: "Re-render the showreel from the HyperFrames composition in CI"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Deliberately unpinned, as in ci.yml: a pinned Bun broke CI once and
          # gained nothing, because the build inputs that matter (the lockfile,
          # the action SHAs) are pinned instead.
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── Showreel freshness gate (hash-verified) ──────────────────────────
      # The committed showreel.mp4 is rendered from the composition in
      # apps/website/showreel/ — the render is done locally via
      # `bun run site:showreel`, never during deploy. The hash of every
      # input to that render is stored beside the video; a mismatch fails
      # the deploy fast so the video can never drift from its source.
      #
      # The hash is computed by a SCRIPT, not by an inline shell command.
      # It used to be duplicated between the workflow and a maintainer's
      # shell, and the two disagreed because `sha256sum` embeds the file
      # name — so the deploy failed on a freshly rendered video. One
      # implementation, called from both places, removes the whole class.
      - name: Verify the showreel matches its inputs
        if: inputs.rebuild-showreel != true
        run: bun run scripts/showreel-hash.ts --check

      - name: Rebuild showreel in CI (dispatched)
        if: inputs.rebuild-showreel == true
        run: |
          cd apps/website
          bun scripts/build-showreel.ts
          cd ../..
          bun run scripts/showreel-hash.ts --write
          echo "⚠ Commit the regenerated showreel + updated .showreel-hash." >> "$GITHUB_STEP_SUMMARY"

      - name: Generate brand assets (favicon, OG card, banner, icons)
        run: bun run --cwd apps/website brand

      - name: Build website
        run: bun run site:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/website/dist

      # The artifact API is eventually consistent. deploy-pages queries the run
      # immediately after upload finalizes and has intermittently found zero
      # artifacts (3 of 5 runs on 2026-11-23), then failed the whole deploy.
      # Re-running the job is not a remedy: it uploads a second artifact with
      # the same name and the deploy fails with "Multiple artifacts".
      - name: Wait for the Pages artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$count" = "1" ]; then
              echo "artifact visible after ${attempt} attempt(s)"
              exit 0
            fi
            if [ "$count" -gt 1 ]; then
              echo "::error::found ${count} github-pages artifacts; dispatch a fresh run instead of re-running this job"
              exit 1
            fi
            sleep 2
          done
          echo "::error::github-pages artifact never became visible"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
