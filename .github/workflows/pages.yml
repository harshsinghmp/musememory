name: GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      rebuild-showreel:
        description: "Re-render the showreel from the HyperFrames composition in CI"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── Showreel freshness gate (hash-verified) ──────────────────────────
      # The committed showreel.mp4 is rendered from the composition in
      # apps/website/showreel/ — the render is done locally via
      # `bun run site:showreel`, never during deploy. The hash of every
      # input to that render is stored beside the video; a mismatch fails
      # the deploy fast so the video can never drift from its source.
      #
      # The hash is computed by a SCRIPT, not by an inline shell command.
      # It used to be duplicated between the workflow and a maintainer's
      # shell, and the two disagreed because `sha256sum` embeds the file
      # name — so the deploy failed on a freshly rendered video. One
      # implementation, called from both places, removes the whole class.
      - name: Verify the showreel matches its inputs
        if: inputs.rebuild-showreel != true
        run: bun run scripts/showreel-hash.ts --check

      - name: Rebuild showreel in CI (dispatched)
        if: inputs.rebuild-showreel == true
        run: |
          cd apps/website
          bun scripts/build-showreel.ts
          cd ../..
          bun run scripts/showreel-hash.ts --write
          echo "⚠ Commit the regenerated showreel + updated .showreel-hash." >> "$GITHUB_STEP_SUMMARY"

      - name: Generate brand assets (favicon, OG card, banner, icons)
        run: bun run --cwd apps/website brand

      - name: Build website
        run: bun run site:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
