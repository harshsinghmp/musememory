name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Storage Version Compatibility Matrix
        run: bun test test/storage_version_compat.test.ts
      - name: Run Test Suite
        run: bun test
      - name: Static Typecheck
        run: bunx tsc --noEmit
      - name: Published-claims manifest is up to date
        # claims.json and the MCP tool matrix are generated from src/. If
        # they are stale, every published number on the site and in the
        # README is quietly wrong. The check fails with the regeneration
        # command.
        run: bun run scripts/generate-claims.ts --check
      - name: Documentation link integrity
        # Catches dead relative links and machine-specific file:/// URLs.
        run: bun run scripts/check-doc-links.ts
      - name: Website release gate
        # The qa-launch gate, executed: critical paths, keyboard-only path,
        # 200% zoom reflow, the no-JavaScript first frame, animation
        # performance, the placeholder sweep, the payload budget and a
        # second rendering engine.
        run: |
          bunx playwright-core install chromium-headless-shell firefox
          bun run site:build
          bun run site:qa
      - name: Self Validation
        run: bun run bin/musememory.ts validate --dry-run
