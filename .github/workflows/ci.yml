name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run Test Suite
        run: bun test
      - name: Static Typecheck
        run: bunx tsc --noEmit
      - name: Self Validation
        run: bun run bin/musememory.ts validate --dry-run
