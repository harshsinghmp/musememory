name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    # Any base branch, not just the trunk. A stacked PR targets its parent
    # feature branch, and restricting this list meant stacked layers got no
    # CI at all — their code was never exercised before merge.
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    # Least privilege: the job reads the repo and the PR's check rollup. The
    # delivery gate needs pull-requests/checks/actions read; nothing needs write.
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The delivery gate at the end of this job proves a commit reached
          # the remote, so the checkout needs the remote's branch refs and the
          # real history. The default checkout is depth-1 and carries only the
          # ref that was checked out, which would leave `origin/<branch>`
          # missing and make the gate fail for every pull request.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        id: setup-bun
        continue-on-error: true
        with:
          # Deliberately NOT pinned. Pinning Bun caused a real incident: the
          # pinned version stopped receiving the runtime fixes the test suite
          # and `bun build` depend on, and CI went red for reasons that had
          # nothing to do with the change under review. The workflow tracks
          # `latest` on purpose — do not "harden" this by adding a version.
          # The release artefacts are pinned where it actually matters: the
          # dependency lockfile is frozen, and every action is SHA-pinned.
          bun-version: latest
      # GitHub release-asset downloads intermittently return 504 to Actions
      # runners while the npm registry stays reachable. Fall back to the npm
      # package instead of failing every PR on the release CDN.
      - name: Install Bun from npm (fallback)
        if: steps.setup-bun.outcome == 'failure'
        run: npm install -g bun@1.4.3
      - name: Verify Bun
        run: bun --version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Storage Version Compatibility Matrix
        run: bun test --timeout 20000 test/storage_version_compat.test.ts
      - name: Run Test Suite
        run: bun test --timeout 20000
      - name: Static Typecheck
        run: bunx tsc --noEmit
      - name: Published-claims manifest is up to date
        # claims.json and the MCP tool matrix are generated from src/. If
        # they are stale, every published number on the site and in the
        # README is quietly wrong. The check fails with the regeneration
        # command.
        run: bun run scripts/generate-claims.ts --check
      - name: CLI reference is up to date
        # docs/cli-reference.md is generated from src/ and was the last derived
        # artifact with no drift gate. An agent following a stale reference calls
        # tools that do not exist, which is exactly how the README table rotted.
        run: bun run scripts/generate-cli-reference.ts --check
      - name: Documentation link integrity
        # Catches dead relative links and machine-specific file:/// URLs.
        run: bun run scripts/check-doc-links.ts
      - name: Changelog covers behavioural commits
        # v3.3.0 shipped to npm with no changelog section, and the R31
        # observation merge plus the D7/D4 fixes later landed under an empty
        # [Unreleased]. Both were caught by a human reading the file, twice in
        # two sessions. Every other derived artifact here is gated for drift;
        # this is the one that kept rotting silently.
        run: bun run scripts/check-changelog.ts
      - name: Showreel matches its inputs
        # The committed video must correspond to the committed composition.
        # Caught here rather than at deploy, so a stale render never reaches
        # production in the first place.
        run: bun run scripts/showreel-hash.ts --check
      - name: Website release gate
        # The qa-launch gate, executed: critical paths, keyboard-only path,
        # 200% zoom reflow, the no-JavaScript first frame, animation
        # performance, the placeholder sweep, the payload budget and a
        # second rendering engine.
        run: |
          bunx playwright-core install chromium-headless-shell firefox
          bun run site:build
          bun run site:qa
      - name: Build
        # The bundle the release assets describe. `--external sqlite-vec` is
        # why the BOM has to ask the native module for its own path below:
        # the bundler never reads that file.
        run: bun run build
      - name: SBOM and checksums
        # CycloneDX 1.7 over the runtime dependencies plus the sqlite-vec
        # platform binary, then SHA-256 of the bundle and the BOM. Generated
        # here and uploaded as an artefact — never committed, because a
        # committed BOM goes stale silently.
        run: |
          bun run sbom
          bun run checksums
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            dist/bom.cdx.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Self Validation
        run: bun run bin/musememory.ts validate --dry-run
      - name: Delivery gate — the branch is pushed and reviewable
        # A commit is not a delivery. This step refuses to let a pull request
        # pass review if its branch was never pushed, if it has no pull
        # request, or if its own checks are failing. See
        # .agents/standards/landing-gate.md.
        # A branch name may legally contain backticks (`git check-ref-format`
        # accepts them), so interpolating `${{ github.head_ref }}` directly into
        # a `run:` block lets a fork PR choose shell syntax that executes before
        # bun starts. The value reaches the script through `env`, which is data.
        env:
          # The gate reads the pull request and its check rollup through the
          # GitHub CLI, which needs an authenticated token. The workflow
          # token is read-only, which is all the gate asks for.
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.head_ref }}
        run: bun run scripts/check-landed.ts --pr --branch "$PR_BRANCH"
        if: github.event_name == 'pull_request'
      - name: Delivery gate — the pushed commit is landed
        # On a push to an integration branch, this proves the commit is
        # reachable from the branch's remote head and that nothing is left
        # unpushed. It is the machine-checkable form of "verified on dev".
        # Same rule as the PR gate: expressions reach the shell through env,
        # never as `${{ }}` inside a run block.
        env:
          INTEGRATION_REF: ${{ github.ref_name }}
        run: bun run scripts/check-landed.ts --integration "$INTEGRATION_REF"
        if: github.event_name == 'push'
